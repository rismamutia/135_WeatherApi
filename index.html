<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoFind — Location API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <main class="container">
    <header class="hero">
      <div class="badge">MAPTILER GEOCODING API</div>
      <h1>Geo<span>Find</span></h1>
      <p>Cari informasi lokasi dengan cepat menggunakan data geocoding dari MapTiler.</p>
    </header>

     <section class="search-card">
      <form id="locationForm">
        <label for="location">Lokasi</label>
        <div class="search-row">
          <input id="location" name="location" type="text"
                 placeholder="Contoh: Yogyakarta" autocomplete="off" required>
          <button type="submit" id="searchButton">
            <span id="buttonText">Cari Lokasi</span>
            <span id="spinner" class="spinner hidden"></span>
          </button>
        </div>
        <small>Masukkan nama kota, kecamatan, provinsi, atau tempat.</small>
      </form>
    </section>

    <div id="message" class="message hidden"></div>

    <section id="resultCard" class="result-card hidden">
      <div class="result-heading">
        <div>
          <span class="eyebrow">HASIL PENCARIAN</span>
          <h2 id="placeTitle">-</h2>
          <p id="placeAddress">-</p>
        </div>
        <div class="pin">⌖</div>
      </div>
